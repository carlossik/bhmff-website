name: TournamentHQ local Supabase validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-local-schema:
    name: Apply migrations to disposable local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm safe, isolated project configuration
        run: node scripts/assert-local-test-config.cjs
      - name: Insert CI-only reconstructed legacy schemas
        run: |
          test -f tests/ci/20260716000000_legacy_schema_baseline.sql
          test ! -e supabase/migrations/20260716000000_legacy_schema_baseline.sql
          cp tests/ci/20260716000000_legacy_schema_baseline.sql supabase/migrations/20260716000000_legacy_schema_baseline.sql
          # Restore original missing Sports Officials migration rather than the CI placeholder.
          test -f tests/ci/20260730000000_create_sports_officials_module.sql
          test ! -e supabase/migrations/20260730000000_create_sports_officials_module.sql
          cp tests/ci/20260730000000_create_sports_officials_module.sql supabase/migrations/20260730000000_create_sports_officials_module.sql
          # Restore original Phase 2 club payments and match-centre foundation.
          test -f tests/ci/20260814000000_phase2_multiteam_club_payments_match_centre.sql
          test ! -e supabase/migrations/20260814000000_phase2_multiteam_club_payments_match_centre.sql
          cp tests/ci/20260814000000_phase2_multiteam_club_payments_match_centre.sql supabase/migrations/20260814000000_phase2_multiteam_club_payments_match_centre.sql
          test -f tests/ci/20260809000000_legacy_media_ownership.sql
          test ! -e supabase/migrations/20260809000000_legacy_media_ownership.sql
          cp tests/ci/20260809000000_legacy_media_ownership.sql supabase/migrations/20260809000000_legacy_media_ownership.sql

          # Recover original migrations accidentally stored under a nested folder.
          # Media migrations are placed after the CI-only media ownership prerequisite.
          # Copies are temporary and exist only on the disposable GitHub runner.
          test -f supabase/migrations/supabase/migrations/20260805_platform_admin_isolation.sql
          test ! -e supabase/migrations/20260805000001_platform_admin_isolation.sql
          cp supabase/migrations/supabase/migrations/20260805_platform_admin_isolation.sql supabase/migrations/20260805000001_platform_admin_isolation.sql
          test -f supabase/migrations/supabase/migrations/20260802_add_media_competition_id.sql
          test ! -e supabase/migrations/20260809000001_add_media_competition_id.sql
          cp supabase/migrations/supabase/migrations/20260802_add_media_competition_id.sql supabase/migrations/20260809000001_add_media_competition_id.sql
          test -f supabase/migrations/supabase/migrations/20260802_public_media_rls.sql
          test ! -e supabase/migrations/20260809000002_public_media_rls.sql
          cp supabase/migrations/supabase/migrations/20260802_public_media_rls.sql supabase/migrations/20260809000002_public_media_rls.sql
          test -f supabase/migrations/supabase/migrations/20260918_extend_competition_rules_public_audit.sql
          test ! -e supabase/migrations/20260918000001_extend_competition_rules_public_audit.sql
          cp supabase/migrations/supabase/migrations/20260918_extend_competition_rules_public_audit.sql supabase/migrations/20260918000001_extend_competition_rules_public_audit.sql
      - name: Restore missing registered goal scorer link (CI only)
        run: |
          test -f tests/ci/20260820000000_legacy_club_goal_squad_link.sql
          test ! -e supabase/migrations/20260820000000_legacy_club_goal_squad_link.sql
          cp tests/ci/20260820000000_legacy_club_goal_squad_link.sql supabase/migrations/20260820000000_legacy_club_goal_squad_link.sql
      - name: Restore match result and goal competition scope (CI only)
        run: |
          test -f tests/ci/20260920000000_ci_results_goals_competition_scope.sql
          test ! -e supabase/migrations/20260920000000_ci_results_goals_competition_scope.sql
          cp tests/ci/20260920000000_ci_results_goals_competition_scope.sql supabase/migrations/20260920000000_ci_results_goals_competition_scope.sql
      - name: Normalize legacy migration filenames for CI only
        run: python3 scripts/ci/prepare_supabase_migrations.py
      - name: Verify restored migration dependencies before Docker
        run: python3 scripts/ci/verify_migration_dependencies.py
      - name: Start local Supabase (Docker)
        run: npx supabase start
      - name: Apply migrations to local database only
        run: npx supabase db reset --local --yes
      - name: Show local services (no secrets)
        run: |
          echo "Local migrations completed. Supabase is disposable and will be destroyed with this runner."
      - name: Stop local services
        if: always()
        run: npx supabase stop --no-backup || true
